name: Build and Deploy Java War package to Azure Web App

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

env:
  AZURE_WEBAPP_NAME: 'calc-gha-29392'

jobs:
  ci-test:
    name: CI test
    runs-on: gh-actions-runner
    strategy:
      matrix:
        java_version: [8, 11]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java_version }}
      - name: Run Tests
        run: mvn test

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: ci-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'
      - name: Build with Maven
        run: mvn package
      - name: Change Warfile Name
        run: mv ${{ github.workspace }}/target/*.war ${{ github.workspace }}/target/ROOT.war
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2.2.19
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/target/ROOT.war
          publish-profile: ${{ secrets.AZURE_WEB_APP_PUBLISH_PROFILE }}

  create-new-release:
    name: Create new release
    runs-on: ubuntu-latest
    if: startsWith(github.event.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref }}
